<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fotogram</title>
        <link rel="stylesheet" href="style.css" />
        <script defer src="template-function.js"></script>
        <script defer src="script.js"></script>
        <link
            rel="icon"
            type="image/svg+xml"
            href="./assets/icon/favicon.svg"
        />
    </head>
    <body>
        <header>
            <img
                src="./assets/img/fotogram_tLogo.png"
                alt="Fotogram"
                class="header-logo"
            />
        </header>
        <main>
            <h1>Your personal photo album</h1>
            <section
                id="photo-container"
                class="gallery-grid"
                aria-label="Photo Gallery"
            ></section>
            <dialog id="photo-highlight" class="photo-highlight"></dialog>
        </main>
        <footer>
            <img
                src="./assets/img/DA_Logo.png"
                alt="Developer Akademie Logo"
                class="footer-logo"
            />
            <p class="footer-p">© 2026 Developer Akademie GmbH</p>
        </footer>
    </body>
</html>
